<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaVzla</title>
    <meta name="description" content="ConectaVzla es una aplicación de mensajería instantánea moderna para comunicarte de forma rápida y segura.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075e54">
    <link rel="icon" type="image/png" href="img/android-chrome-192.png">
    <link rel="shortcut icon" type="image/png" href="img/android-chrome-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ConectaVzla">
    <link rel="apple-touch-icon" href="img/android-chrome-192.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <div id="login-view" class="view active">
            <div class="login-container">
                <img src="img/logo.webp" alt="Logo ConectaVzla" class="app-logo-large">
                <h2>Bienvenido a ConectaVzla</h2>
                <p>Ingresa con tu cuenta segura:</p>
                <input type="text" id="username-input" placeholder="Usuario" autocomplete="username">
                <input type="password" id="password-input" placeholder="Contraseña" autocomplete="current-password">
                <button id="btn-start">Entrar</button>
                <button id="btn-register" class="btn-secondary">Crear cuenta nueva</button>
                <p id="login-error"></p>
            </div>
        </div>

        <div id="chat-list-view" class="view">
            <header class="app-header">
              <h1 class="app-title">
                <img src="img/logo.webp" alt="Logo ConectaVzla" class="app-logo">
                ConectaVzla
              </h1>
                <div class="header-actions">
                <img id="my-avatar" src="img/avatar.webp" alt="Mi avatar" class="my-avatar" title="Toca para cambiar tu avatar">
                <button id="btn-status-tab" title="Novedades" aria-label="Novedades">🌟</button>
                <button id="btn-change-pass" title="Cambiar contraseña" aria-label="Cambiar contraseña">🔑</button>
                <button id="btn-export" title="Exportar contactos" aria-label="Exportar contactos">📤</button>
                <button id="btn-logout" title="Cerrar sesión" aria-label="Cerrar sesión">🚪</button>
                <button id="btn-new-chat" title="Nuevo Chat" aria-label="Nuevo Chat">➕</button>
              </div>
              <input type="file" id="avatar-input" accept="image/*" style="display: none;">
            </header>
              
            <div class="search-bar">
                <input type="text" id="search-contact" placeholder="Buscar contacto...">
            </div>
            
            <div class="chats-title-container">
              <h2 class="chats-title">Chats</h2>
            </div>

            <div class="contacts-list" id="contacts-container">
            </div>
        </div>

       <div id="chat-room-view" class="view">
    <header class="chat-header">
       <button id="btn-back" aria-label="Volver">⬅️</button>
       <img src="img/avatar.webp" alt="Avatar" class="avatar" id="contact-avatar">  
       <div class="active-user-info">
            <span id="active-name">ConectaVzla</span>
            <span class="status-online" id="active-status">En línea</span>
       </div>
            <!-- ========== VISTA DE NOVEDADES ========== -->
    <div id="status-view" class="view">
        <header class="chat-header">
            <button id="btn-status-back" aria-label="Volver">⬅️</button>
            <div class="active-user-info">
                <span>Novedades</span>
                <span class="status-online">Últimas 24 horas</span>
            </div>
        </header>
        <div class="contacts-list" id="status-list"></div>
        <input type="file" id="status-image-input" accept="image/*" style="display: none;">
    </div>

    <!-- ========== VISOR DE NOVEDADES (PANTALLA COMPLETA) ========== -->
    <div id="status-viewer">
        <div class="viewer-header">
            <img id="viewer-avatar" src="img/avatar.webp" alt="Avatar" class="avatar" style="width:38px;height:38px;">
            <div class="active-user-info">
                <span id="viewer-name"></span>
                <span id="viewer-time" class="status-online"></span>
            </div>
            <span id="viewer-counter" class="viewer-counter"></span>
            <button id="viewer-delete" class="viewer-btn" title="Eliminar">🗑️</button>
            <button id="viewer-close" class="viewer-btn" title="Cerrar">✖</button>
        </div>
        <div class="viewer-body">
            <button id="viewer-prev" class="viewer-nav" style="left:8px;">‹</button>
            <img id="viewer-image" src="" alt="Novedad">
            <p id="viewer-text"></p>
            <button id="viewer-next" class="viewer-nav" style="right:8px;">›</button>
        </div>
    </div>
    </header>

    <!-- Barra superior de audio y video (como en la imagen) -->
    <div class="calls-bar">
        <button id="btn-voice" class="call-btn" title="Grabar nota de voz">
            <span class="call-icon">🎤</span>
            <span class="call-label">Nota de voz</span>
        </button>
        <button id="btn-video-msg" class="call-btn" title="Grabar videomensaje">
            <span class="call-icon">📹</span>
            <span class="call-label">Videomensaje</span>
        </button>
    </div>

    <div class="messages-container" id="messages-container">
    </div>

    <footer class="chat-input-bar">
        <input type="text" id="message-input" placeholder="Escribe un mensaje...">
        <button id="btn-image" title="Subir imágenes (máx. 2)">📷</button>
        <button id="btn-send" title="Enviar">➤</button>
        <input type="file" id="image-input" accept="image/*" multiple style="display: none;">
    </footer>
</div>
    </div>

    <script src="app.js"></script>
    <audio id="notification-sound" src="sonidos/notification.mp3" preload="auto"></audio>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js')
            .then(function() { console.log('Service Worker registrado'); })
            .catch(function(err) { console.error('Error al registrar SW:', err); });
        });
      }
    </script>
</body>
</html>
